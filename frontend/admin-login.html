<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velora | Admin Sign In</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #090d16;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.1) 0px, transparent 50%);
            margin: 0;
            padding: 20px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #f8fafc;
        }
        .admin-login-card {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
        }
        .admin-login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .admin-brand-icon {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 16px;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }
        .admin-login-header h1 {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: #ffffff;
            letter-spacing: -0.5px;
        }
        .admin-login-header p {
            color: #94a3b8;
            font-size: 13.5px;
            margin: 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #fff;
            font-size: 14px;
            transition: all 0.15s ease;
            box-sizing: border-box;
        }
        .form-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background: #0f172a;
        }
        .btn-admin-submit {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #fff;
            font-size: 14.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            margin-top: 10px;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }
        .btn-admin-submit:hover {
            background: linear-gradient(135deg, #4338ca, #4f46e5);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
            transform: translateY(-1px);
        }
        .btn-admin-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .login-alert {
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }
        .login-alert.error {
            display: block;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }
        .login-alert.success {
            display: block;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
        }
        .admin-footer-links {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: #64748b;
        }
        .admin-footer-links a {
            color: #818cf8;
            text-decoration: none;
        }
        .admin-footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="admin-login-card">
        <div class="admin-login-header">
            <div class="admin-brand-icon">V</div>
            <h1>Admin Control Panel</h1>
            <p>Sign in with your Velora administrator account</p>
        </div>

        <div id="loginMessage" class="login-alert"></div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label class="form-label" for="adminEmail">Administrator Email</label>
                <input 
                    type="email" 
                    id="adminEmail" 
                    class="form-input" 
                    placeholder="admin@velora.com" 
                    required 
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="adminPassword">Password</label>
                <input 
                    type="password" 
                    id="adminPassword" 
                    class="form-input" 
                    placeholder="••••••••••••" 
                    required 
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" id="adminLoginBtn" class="btn-admin-submit">
                Sign In to Admin
            </button>
        </form>

        <div class="admin-footer-links">
            <a href="index.html">← Back to Storefront</a>
        </div>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            const btn = document.getElementById('adminLoginBtn');
            const msg = document.getElementById('loginMessage');

            btn.disabled = true;
            btn.textContent = 'Verifying credentials...';
            msg.className = 'login-alert';
            msg.textContent = '';

            try {
                const response = await fetch('../backend/api/admin-login.php', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok || data.success !== true) {
                    throw new Error(data.message || 'Login failed.');
                }

                msg.className = 'login-alert success';
                msg.textContent = 'Access authorized! Redirecting to dashboard...';

                // Save admin token/info locally
                localStorage.setItem('veloraAdminUser', JSON.stringify(data.user));

                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 800);

            } catch (err) {
                msg.className = 'login-alert error';
                msg.textContent = err.message;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In to Admin';
            }
        });
    </script>
</body>
</html>
