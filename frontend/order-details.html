<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Details | Velora</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f7f8fc;
            color: #172033;
            font-family: Arial, Helvetica, sans-serif;
        }

        .order-details-page {
            width: 100%;
            max-width: 1100px;
            margin: 40px auto;
            padding: 24px;
        }

        .order-details-page h1 {
            margin: 12px 0 24px;
            font-size: 30px;
        }

        .order-details-section,
        .tracking-section {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 22px;
            min-width: 0;
        }

        .order-details-section h3,
        .tracking-section h3 {
            margin-top: 0;
        }

        .back-to-orders {
            display: inline-block;
            margin-bottom: 16px;
            color: #2563eb;
            text-decoration: none;
        }

        .back-to-orders:hover {
            text-decoration: underline;
        }

        .order-info p,
        .order-details-content p {
            margin: 12px 0;
            line-height: 1.65;
            overflow-wrap: anywhere;
        }

        .order-status-text,
        .delivery-update {
            font-weight: 600;
        }

        .status-placed {
            color: #a16207;
        }

        .status-confirmed,
        .status-shipped {
            color: #2563eb;
        }

        .status-delivered {
            color: #15803d;
        }

        .status-cancelled {
            color: #dc2626;
        }

        /* Product list */

        .order-items,
        .order-items-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            min-width: 0;
        }

        .order-item {
            display: grid;
            grid-template-columns: 100px minmax(0, 1fr) auto;
            align-items: center;
            gap: 18px;
            width: 100%;
            min-width: 0;
            padding: 16px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .order-item-image {
            display: block;
            width: 100px;
            height: 110px;
            max-width: 100%;
            object-fit: contain;
            object-position: center;
            background: #f8fafc;
            border-radius: 8px;
        }

        .order-item-info {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .order-item-info h4 {
            margin: 0 0 8px;
            font-size: 16px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .order-item-info p {
            margin: 5px 0;
            font-size: 14px;
        }

        .order-item-subtotal {
            font-weight: 700;
            text-align: right;
            white-space: nowrap;
        }

        .order-total {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid #e5e7eb;
            font-size: 20px;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        /* Payment */

        .payment-status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }

        .payment-paid {
            background: #dcfce7;
            color: #166534;
        }

        .payment-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .payment-failed {
            background: #fee2e2;
            color: #991b1b;
        }

        .payment-refunded {
            background: #dbeafe;
            color: #1e40af;
        }

        .payment-unknown {
            background: #f3f4f6;
            color: #374151;
        }

        .payment-note {
            color: #92400e;
        }

        /* Tracking timeline */

        .order-timeline {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin: 28px 0 12px;
        }

        .timeline-step {
            min-width: 0;
            text-align: center;
        }

        .timeline-marker {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 38px;
            height: 38px;
            margin: 0 auto 10px;
            border: 2px solid #d1d5db;
            border-radius: 50%;
            background: #fff;
            color: #6b7280;
            font-weight: 700;
        }

        .timeline-step.completed .timeline-marker {
            background: #16a34a;
            border-color: #16a34a;
            color: #fff;
        }

        .timeline-step.current .timeline-marker {
            background: #2563eb;
            border-color: #2563eb;
            color: #fff;
        }

        .timeline-content h4 {
            font-size: 14px;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .timeline-description,
        .timeline-date {
            font-size: 12px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .timeline-step.completed .timeline-label {
            color: #15803d;
        }

        .timeline-step.current .timeline-label {
            color: #2563eb;
            font-weight: 700;
        }

        .timeline-current-label {
            display: inline-block;
            color: #2563eb;
            font-size: 12px;
            font-weight: 700;
        }

        .cancelled-message {
            padding: 18px;
            border: 1px solid #fecaca;
            border-radius: 8px;
            background: #fef2f2;
            color: #b91c1c;
        }

        .delivery-message {
            color: #15803d;
            font-weight: 600;
        }

        /* Buttons */

        #cancelOrderBtn {
            border: none;
            border-radius: 6px;
            background: #dc2626;
            color: #fff;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 14px;
        }

        #cancelOrderBtn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        #viewInvoiceBtn,
        #printReceiptBtn,
        #markPaymentPaidBtn {
            margin: 8px 0 0 8px;
            padding: 10px 16px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: #fff;
            color: #172033;
            cursor: pointer;
        }

        #viewInvoiceBtn:hover,
        #printReceiptBtn:hover,
        #markPaymentPaidBtn:hover {
            background: #f3f4f6;
        }

        #orderStatus {
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        /* Mobile layout */

        @media (max-width: 700px) {
            .order-details-page {
                margin: 16px auto;
                padding: 14px;
            }

            .order-details-page h1 {
                font-size: 25px;
            }

            .order-details-section,
            .tracking-section {
                padding: 16px;
            }

            .order-item {
                grid-template-columns: 76px minmax(0, 1fr);
                gap: 12px;
                align-items: start;
            }

            .order-item-image {
                width: 76px;
                height: 86px;
            }

            .order-item-subtotal {
                grid-column: 2;
                text-align: left;
                white-space: normal;
            }

            .order-timeline {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 22px 12px;
            }

            .timeline-marker {
                width: 32px;
                height: 32px;
                font-size: 12px;
            }

            #viewInvoiceBtn,
            #printReceiptBtn,
            #markPaymentPaidBtn {
                margin-left: 0;
                margin-right: 5px;
            }
        }
    </style>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
</head>

<body>

    <main class="order-details-page">

        <a href="my-orders.html" class="back-to-orders">
            &larr; Back to My Orders
        </a>

        <h1>Order Details</h1>

        <section class="order-details-section">
            <div id="orderDetails" aria-live="polite">
                <p>Loading order details...</p>
            </div>
        </section>

        <section class="tracking-section">
            <div id="orderTimeline"></div>
        </section>

        <section class="order-details-section">
            <h3>Order Status</h3>
            <div id="orderStatus" aria-live="polite">
                Loading order tracking...
            </div>
        </section>

        <section class="order-details-section">
            <h3>Manage Order</h3>

            <button type="button" id="viewInvoiceBtn">
                View Invoice
            </button>

            <button type="button" id="cancelOrderBtn">
                Cancel Order
            </button>

            <button
                type="button"
                id="markPaymentPaidBtn"
                style="display:none"
            >
                Mark COD Payment as Paid
            </button>

            <button type="button" id="printReceiptBtn">
                Print Receipt
            </button>
        </section>

    </main>

    <script src="js/order-details.js"></script>

</body>
</html>
