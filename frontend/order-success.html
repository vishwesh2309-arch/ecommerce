<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | Velora</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
</head>
<body>

    <header class="header">
        <div class="container nav-container">
            <a href="index.html" class="logo">Velora</a>

            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="wishlist.html">Wishlist</a>
                <a href="cart.html">
                    Cart <span class="cart-count">0</span>
                </a>
                
            </nav>
        </div>
    </header>


    <section class="order-success-section">
        <div class="container">

            <div class="order-success-card">

                <div class="success-icon">
                    ✓
                </div>

                <p class="success-label">
                    ORDER CONFIRMED
                </p>

                <h1>
                    Thank You for Your Order!
                </h1>

                <p class="success-message">
                    Your order has been placed successfully.
                </p>

                <div class="order-details-box">

                    <div class="order-detail-row">
                        <span>Order ID</span>
                        <strong id="successOrderId">
                            —
                        </strong>
                    </div>

                    <div class="order-detail-row">
                        <span>Total Amount</span>
                        <strong id="successOrderTotal">
                            ₹0
                        </strong>
                    </div>

                </div>

                <p class="success-note">
                    We have saved your order details.
                    Thank you for shopping with Velora!
                </p>

                <div class="success-actions">
                    <a
                        href="products.html"
                        class="continue-shopping"
                    >
                        Continue Shopping
                    </a>

                    <a
                        href="index.html"
                        class="back-home-button"
                    >
                        Back to Home
                    </a>
                </div>

            </div>

        </div>
    </section>


    <footer class="footer">
        <div class="container">
            <p>
                © 2026 Velora. All rights reserved.
            </p>
        </div>
    </footer>


    <script src="js/script.js"></script>

</body>
</html>
